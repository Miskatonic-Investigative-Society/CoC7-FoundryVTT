_id: NOsh6EdNSjpjahDF
name: Vendedor Ambulante
type: occupation
img: icons/svg/ice-aura.svg
system:
  source: 'FoundryVTT CoC7'
  description:
    value: '<p>Também conhecidos como “mascates” e “ambulantes”, vendedores ambulantes circulam, geralmente com um carrinho de mão ou carrinho, vendendo pequenos artigos a transeuntes, como objetos artesanais, comidas e petiscos ou outros itens baratos. São conhecidos por anunciar suas mercadorias em voz alta para atrair clientes, bem como por seu jogo de cintura e conversa para aumentar as vendas.</p><p>Passar o dia todo na rua significa que conhecem diferentes localidades, o vai e vem dos moradores, e são um ímã para coletar ou iniciar fofocas.</p><p><strong>Contatos Sugeridos:</strong> outros vendedores, forças da lei locais, fornecedores comerciais, mordomos e outros empregados domésticos.</p>'
  type:
    classic: true
  occupationSkillPoints:
    app:
      multiplier: 4
      selected: true
  creditRating:
    min: 10
    max: 40
  skills:
   - i.skill.appraise
   - i.skill.fighting-brawl
   - i.skill.listen
   - i.skill.navigate
   - i.skill.psychology
  groups:
   - options: 1
     skills:
      - i.skill.accounting
      - i.skill.art-craft-any
   - options: 1
     skills:
      - i.skill.charm
      - i.skill.fast-talk
   - options: 1
     skills:
      - i.skill.language-any
      - i.skill.sleight-of-hand
  personal: 0
flags:
  CoC7:
    cocidFlag:
      id: i.occupation.street-vendor
      lang: pt-BR
      priority: 0
