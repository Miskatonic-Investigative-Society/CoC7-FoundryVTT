_id: lu04TIRrg9P3vRqY
name: Pacificador
type: archetype
img: icons/svg/invisible.svg
system:
  source: 'FoundryVTT CoC7'
  description:
    value: '<p>Uma pessoa solucionadora de problemas que possui uma habilidade natural para encontrar ou perceber o “olho da tempestade” e enxergar uma questão por todos os lados. Motivado pela harmonia, o pacificador busca manter o equilíbrio, seja entre indivíduos ou grupos de pessoas, e preservar o status quo. Seu objetivo é trazer soluções e pode ser muito adaptável, embora às vezes em prejuízo próprio, pois coloca todos os outros à frente de suas próprias necessidades. Embora muitas vezes descrito como “tranquilo” ou “passivo”, pode ser firme, sensato e ousado, especialmente quando uma crise acontece.</p>'
  suggestedOccupations: '<p>Atleta, Barman/Garçonete, Policial de Ronda, Mordomo, Criminoso, Autoridade Eleita, Operário, Missionário, Enfermeiro, Sacerdote, Secretário, Iogue.</p>'
  suggestedTraços: '<p>calmo sob pressão, sensato, modesto, altruísta.</p>'
  coreCharacteristics:
    app: true
    int: true
  skills:
   - i.skill.charm
   - i.skill.fast-talk
   - i.skill.history
   - i.skill.first-aid
   - i.skill.intimidate
   - i.skill.language-any
   - i.skill.listen
   - i.skill.persuade
   - i.skill.psychology
   - i.skill.spot-hidden
flags:
  CoC7:
    cocidFlag:
      id: i.archetype.peacemaker
      lang: pt-BR
      priority: 0
