_id: 4Rrff1sAoWh7NFkL
name: Feitiço de Teste
type: spell
img: systems/CoC7/assets/icons/pentagram-rose.svg
system:
  castingTime: 10 - 15 minutos
  costList:
    - type: promptToggleButton
      if: ''
      config: '{"prompt":"O alvo esta acordado","variable":"@awake"}'
    - type: promptRequireNumber
      if: ''
      config: '{"prompt":"Quantidade de pontos de magia que voce esta gastando","variable":"@castermp"}'
    - type: additionalCasterPromptAdd
      if: ''
      config: '{"prompt":"Outros que conhecem o feitico","variable":"@casters","step":"1","min":"0"}'
    - type: additionalCasterPromptRequireNumber
      if: ''
      config: '{"prompt":"Pontos de magia","variable":"@castermp"}'
    - type: additionalCasterPromptAdd
      if: ''
      config: '{"prompt":"Outros conjuradores","variable":"@others","step":"1","min":"0"}'
    - type: additionalCasterCost
      if: ''
      config: '{"modify":"mp","value":"1"}'
    - type: triggerPrompt
      if: ''
    - type: casterCost
      if: ''
      config: '{"modify":"mp","value":"@castermp"}'
    - type: casterCost
      if: ''
      config: '{"modify":"san","value":"1D3 - 1"}'
    - type: casterCost
      if: '@awake'
      config: '{"modify":"pow","value":"1"}'
    - type: castingTime
      if: '!@awake'
      config: '{"value":"10 minutos"}'
    - type: castingTime
      if: '@awake'
      config: '{"value":"15 minutos"}'
    - type: setVariable
      if: ''
      config: '{"variable":"@totalMp","value":"@others.length + @casters.castermp + @castermp"}'
    - type: setVariable
      if: ''
      config: '{"variable":"@minutes","value":"@totalMp / 6"}'
    - type: additionalInformation
      if: ''
      config: '{"prompt":"Duracao do pesadelo: @minutes minutos"}'
  description:
    value: "<p>Force outro humano a ter um pesadelo.</p><p>O conjurador adiciona uma quantidade de pontos de magia e sofre [[/r 1D3 - 1]] Pontos de Sanidade. Se o alvo dos pesadelos estiver acordado, o conjurador deve gastar 1 POD e a conjuração leva cinco minutos adicionais.</p><p>Conjuradores adicionais que conheçam o feitiço também podem adicionar uma quantidade de pontos de magia; qualquer outra pessoa presente pode adicionar um ponto de magia.</p><p>O pesadelo começa com o alvo fazendo uma prova para a qual não estudou e será prolongado em um minuto para cada seis pontos de magia gastos.</p><p></p>"
  source: FoundryVTT CoC7
  type:
    bind: false
    call: false
    combat: false
    contact: true
    dismiss: false
    enchantment: false
    gate: false
    summon: false
flags:
  CoC7:
    cocidFlag:
      id: i.spell.test-spell
      lang: pt-BR
      priority: 0
